data:
  context_length: 60
  stride: 15
  horizons: [1, 5, 15, 30, 60]
  input_channels: [open, high, low, close, volume]
  target_channel: close

  # raw: context-normalised OHLCV levels
  # context_log_change: matched-origin within-context one-step log changes
  input_representation: raw

normalisation:
  eps: 1.0e-8
  clip: false
  clip_min: -5.0
  clip_max: 5.0

model:
  # normalised_close: legacy direct price-level output in the context Close
  # normalisation frame.
  # cumulative_log_change: direct log(P[t+h] / P[t]) output at each horizon.
  output_representation: normalised_close

  # Use zero for cumulative-log-change output so the initial forecast is
  # exactly persistence (zero cumulative return).
  output_head_initialisation: default

  temporal:
    # transformer | modern_tcn
    type: transformer
    d_model: 64

    # Transformer-only settings.
    num_layers: 1
    num_heads: 4
    feedforward_multiplier: 2
    dropout: 0.0
    relative_position_embedding: true

    # Same p/sin/cos absolute session-position information used by the
    # validation-selected per-asset OHLCV ModernTCN baseline.
    session_position_encoding: true

    # Used when temporal.type=modern_tcn.
    modern_tcn:
      patch_size: 8
      patch_stride: 4
      ffn_ratio: 1
      num_blocks: 1
      large_kernel: 51
      small_kernel: 5
      dropout: 0.05
      head_dropout: 0.0

  graph:
    # none | fixed | free_static | dynamic | dynamic_base
    type: none
    num_heads: 2
    hidden_dim: 32
    activation: softmax
    add_self_loops: false

    # Dynamic-base graph settings. Alpha is the weight on the full
    # input-conditioned base-plus-dynamic adjacency.
    base_graph_type: free_static
    gate_type: learned_scalar
    initial_alpha: 0.25

  # Reuses the project's existing BaseDyGraph-style graph loss. The first
  # continuous regularisation test uses only target-row-entropy matching.
  graph_regularisation:
    graph_reg_layer: -1
    graph_reg_warmup_epochs: 0
    graph_entropy_reg: 0.0
    graph_target_entropy: null
    graph_target_entropy_reg: 0.0
    graph_temporal_smooth_reg: 0.0

  # Fitted from January-August training observations only when graph.type=fixed.
  fixed_graph_resource:
    type: absolute_return_correlation
    channel: close
    threshold: 0.18
    empty_row_policy: error

  spatial:
    num_layers: 1
    feedforward_multiplier: 2
    dropout: 0.0

    # none: beta=1 and the graph branch is used fully.
    # fixed: use initial_beta as a fixed convex mixture.
    # learned_scalar: learn beta=sigmoid(raw_beta).
    gate_type: none
    initial_beta: 1.0

  head_dropout: 0.0

training:
  # mse: normalised-Close objective used by the legacy ModernTCN comparison
  # cumulative_log_change_mae: direct L1 objective in cumulative-log-change
  # space. Required when model.output_representation=cumulative_log_change.
  loss:
    type: mse
    bps_scale: 10000.0

  optimizer: adam
  scheduler: modern_tcn_type3
  # Backbone/forecasting parameters and graph-learner parameters use
  # separate Adam parameter groups. The scheduler preserves this LR ratio.
  learning_rate: 1.0e-4
  graph_learning_rate: 1.0e-3
  weight_decay: 0.0

  # Separate forecast-vs-regulariser graph-gradient diagnostics are computed
  # on only this many batches per epoch to keep the sweep inexpensive.
  graph_diagnostics_batches_per_epoch: 1

  batch_size: 16
  validation_batch_size: 32
  num_workers: 0

  max_epochs: 100
  patience: 10
  min_delta: 0.0
  gradient_clip_norm: 1.0
  mixed_precision: true
  seed: 42

  # The ModernTCN graph sweep overrides the loss to cumulative-log-change
  # MAE; under that contract validation_loss is the exact five-horizon mean
  # Log MAE used for automatic stage selection.
  selection_metric: validation_loss
  selection_horizons: [1, 5]
