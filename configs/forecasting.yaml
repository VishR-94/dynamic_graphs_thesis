data:
  split:
    val_start: "2024-09-01"
    test_start: "2024-10-01"

forecasting:
  context_length: 60
  stride: 15

  horizons:
    - 1
    - 5
    - 15
    - 30
    - 60

  input_channels:
    - open
    - high
    - low
    - close
    - volume

  target_channels:
    - close

features:
  representation: raw

normalisation:
  enabled: true
  method: window_context

  clip: false
  clip_min: -5.0
  clip_max: 5.0

  eps: 1.0e-8

  window_context:
    stats_from: context
    scope: per_asset_channel
    apply_to_target: true
    include_stats: true
    stats:
      - mean
      - log_std

  global_train:
    fit_on: train
    scope: all_assets
    apply_to_target: true

training:
  batch_size: 32
  num_workers: 0

models:
  modern_tcn:
    patch_size: 8
    patch_stride: 4
    hidden_dim: 64
    ffn_ratio: 1
    num_blocks: 1
    large_kernel: 51
    small_kernel: 5
    dropout: 0.05
    head_dropout: 0.0

    temporal_encoding:
      enabled: False

    variable_layout: joint
    revin: false
    revin_affine: false
    subtract_last: false
    individual_head: false
    use_multi_scale: false
    small_kernel_merged: false

    training:
      learning_rate: 1.0e-4
      weight_decay: 0.0
      batch_size: 16
      max_epochs: 100
      patience: 10
      seed: 42
      scheduler_type: type3
  
  kronos:
    model_id: "NeoQuasar/Kronos-small"
    model_revision: "ac5c409a313c4eadd1ca78201322f5cadb9c34ab"

    tokenizer_id: "NeoQuasar/Kronos-Tokenizer-base"
    tokenizer_revision: "9ef143b98ee3c2488eebd85404e0c215c112b46a"

    inference:
      device: "auto"
      dtype: "float32"

      max_context: 512
      clip: 5.0

      temperature: 0.6
      top_k: 0
      top_p: 0.9
      sample_count: 10

      seed: 42
      series_batch_size: 1
      verbose: false
  