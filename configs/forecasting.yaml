data:
  split_names:
    - train
    - val
    - test

forecasting:
  context_length: 60

  horizons:
    - 1
    - 5
    - 15
    - 30
    - 60

  input_channels:
    - open
    - high
    - low
    - close
    - volume
    - amount

  target_channels:
    - open
    - high
    - low
    - close
    - volume

features:
  representation: raw

normalisation:
  enabled: true
  method: window_context

  clip: true
  clip_min: -5.0
  clip_max: 5.0

  eps: 1.0e-8

  window_context:
    stats_from: context
    scope: per_asset_channel
    apply_to_target: true
    include_stats: true
    stats:
      - mean
      - log_std

  global_train:
    fit_on: train
    scope: all_assets
    apply_to_target: true

training:
  batch_size: 32
  num_workers: 0

evaluation:
  metrics:
    - mae
    - mse
    - rmse