default_preset: structured_parallel_uniform
data:
  mode: real
  amount_mode: zero
forecasting:
  context_length: 60
  prediction_length: 60
  evaluation_horizons:
  - 1
  - 5
  - 15
  - 30
  - 60
  stride: 15
  input_channels:
  - open
  - high
  - low
  - close
  - volume
  target_channels:
  - open
  - high
  - low
  - close
  - volume
normalisation:
  method: kronos_context
  stats_from: context
  scope: per_asset_channel
  clip: true
  clip_min: -5.0
  clip_max: 5.0
  eps: 1.0e-05
graph_resource:
  # Deterministic graph fitted outside the neural model. ``none`` keeps
  # the existing learned/no-graph modes unchanged. The production
  # correlation graph is always fitted from the cleaned training split.
  type: none
  channel: close
  threshold: 0.18
  empty_row_policy: error
models:
  dynamic_graph:
    num_nodes: 93
    context_length: 60
    d_model: 64
    num_st_blocks: 1
    use_node_embedding: true
    token_input_representation: hierarchical_embedding
    temporal:
      type: transformer
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0
      kernel_size: 3
      dilations:
      - 1
      - 2
      - 4
      modern_tcn:
        patch_size: 8
        patch_stride: 4
        ffn_ratio: 1
        num_blocks: 1
        large_kernel: 15
        small_kernel: 5
        dropout: 0.05
    graph:
      type: mtgnn_static
      num_heads: 2
      hidden_dim: 32
      activation: softmax
      add_self_loops: false
      mtgnn_embedding_dim: 16
      mtgnn_top_k: 8
      mtgnn_alpha: 3.0
      base_graph_type: mtgnn_static
      gate_type: learned_scalar
      initial_alpha: 0.5
    spatial:
      num_layers: 1
      feedforward_multiplier: 2
      dropout: 0.0
      gate_type: none
      initial_beta: 1.0
    heads:
      prediction_length: 60
      evaluation_horizons:
      - 1
      - 5
      - 15
      - 30
      - 60
      s1_vocabulary_size: 1024
      s2_vocabulary_size: 1024
      s2_loss_weight: 1.0
      future_token_mode: full
      s2_conditioning: true_s1
    future_predictor:
      type: structured_parallel
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0
    loss:
      horizon_weighting: uniform
      exponential_half_life: 5.0
      exponential_floor_weight: 0.25
    graph_regularisation:
      graph_reg_layer: -1
      graph_reg_warmup_epochs: 0
      graph_entropy_reg: 0.0
      graph_target_entropy: null
      graph_target_entropy_reg: 0.0
      graph_temporal_smooth_reg: 0.0
    backcast:
      enabled: false
      loss_weight: 0.0
      num_channels: 5
training:
  optimizer: adamw
  scheduler: none
  learning_rate: 0.0001
  graph_learning_rate: 0.0001
  weight_decay: 0.0
  batch_size: 2
  num_workers: 0
  max_epochs: 50
  patience: 8
  seed: 42
  gradient_clip_norm: 1.0
  mixed_precision: true
    # Controls the checkpoint used for patience and best_checkpoint.pt.
  #
  # Supported values:
  #   decoded_cumulative_log_change_mae
  #   validation_token_loss
  early_stopping_metric: decoded_cumulative_log_change_mae

  # Used only when early_stopping_metric is
  # decoded_cumulative_log_change_mae.
  #
  # Keep the base configuration equivalent to the historical runs.
  # The new short-horizon run will override this to [1, 5].
  early_stopping_horizons:
    - 1
    - 5
    - 15
    - 30
    - 60
decoding:
  # Training/checkpoint selection is deliberately deterministic.
  token_selection: argmax
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  sample_count: 1

# Post-training inference-only Monte Carlo sweep. Temperature never enters
# the supervised cross-entropy objective or checkpoint selection.
temperature_sweep:
  temperatures:
    - 0.3
    - 0.45
    - 0.6
    - 0.8
    - 1.0
  sample_count: 10
  top_k: 0
  top_p: 0.9
  seed: 42
presets:
  modern_tcn_dynamic_coarse_mc10:
    models:
      dynamic_graph:
        num_nodes: 93
        context_length: 60
        d_model: 32
        num_st_blocks: 1
        use_node_embedding: false
        token_input_representation: bsq_bits

        temporal:
          type: modern_tcn
          num_layers: 1
          num_heads: 4
          feedforward_multiplier: 2
          dropout: 0.0
          kernel_size: 3
          dilations: [1, 2, 4]
          modern_tcn:
            patch_size: 8
            patch_stride: 4
            ffn_ratio: 1
            num_blocks: 1
            large_kernel: 15
            small_kernel: 5
            dropout: 0.05

        graph:
          type: dynamic
          num_heads: 1
          hidden_dim: 32
          activation: softmax
          add_self_loops: false
          base_graph_type: free_static
          gate_type: none
          initial_alpha: 0.5

        spatial:
          num_layers: 1
          feedforward_multiplier: 2
          dropout: 0.0
          gate_type: learned_scalar
          initial_beta: 0.5

        heads:
          prediction_length: 60
          evaluation_horizons: [1, 5, 15, 30, 60]
          s1_vocabulary_size: 1024
          s2_vocabulary_size: 1024
          s2_loss_weight: 0.0
          future_token_mode: coarse_only
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel
          num_layers: 1
          num_heads: 4
          feedforward_multiplier: 2
          dropout: 0.0

        loss:
          horizon_weighting: uniform

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: null
          graph_target_entropy_reg: 0.0
          graph_temporal_smooth_reg: 0.0

        backcast:
          enabled: false
          loss_weight: 0.0
          num_channels: 5

    training:
      optimizer: adam
      scheduler: modern_tcn_type3
      learning_rate: 0.0001
      graph_learning_rate: 0.0005
      weight_decay: 0.0
      batch_size: 2
      num_workers: 0
      max_epochs: 100
      patience: 10
      seed: 42
      gradient_clip_norm: 1.0
      mixed_precision: true
      # Coarse-token cross-entropy is a proper scoring rule for the full
      # categorical predictive distribution used by Monte Carlo sampling.
      # In coarse-only mode, validation_token_loss is exactly validation
      # s1 cross-entropy over all 60 future positions and all assets.
      early_stopping_metric: validation_token_loss
      early_stopping_horizons: [1, 5, 15, 30, 60]

    decoding:
      token_selection: argmax
      temperature: 1.0
      top_k: 0
      top_p: 1.0
      sample_count: 1

  structured_parallel_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: uniform
  structured_parallel_weighted:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: exponential_decay
  autoregressive_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: autoregressive
        loss:
          horizon_weighting: uniform
  structured_parallel_coarse_only:
    models:
      dynamic_graph:
        heads:
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: uniform
  fixed_correlation_coarse_only_exponential:
    graph_resource:
      type: absolute_return_correlation
      channel: close
      threshold: 0.18
      empty_row_policy: error

    models:
      dynamic_graph:
        graph:
          type: fixed
          add_self_loops: false

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: null
          graph_target_entropy_reg: 0.0
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel
          num_layers: 1

        loss:
          horizon_weighting: exponential_decay
          exponential_half_life: 5.0
          exponential_floor_weight: 0.25

    training:
      early_stopping_metric: decoded_cumulative_log_change_mae
      early_stopping_horizons:
        - 1
        - 5

  free_static_full_true_s1:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: full
          s2_loss_weight: 1.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform

  free_static_coarse_only:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform

  free_static_full_predicted_s1:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: full
          s2_loss_weight: 1.0
          s2_conditioning: predicted_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform


  free_static_coarse_only_remapped150_exponential:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static
          add_self_loops: false

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.05
          graph_temporal_smooth_reg: 0.0

        heads:
          s1_vocabulary_size: 150
          s2_vocabulary_size: 1024
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel
          num_layers: 1

        loss:
          horizon_weighting: exponential_decay
          exponential_half_life: 5.0
          exponential_floor_weight: 0.25

    training:
      early_stopping_metric: decoded_cumulative_log_change_mae
      early_stopping_horizons:
        - 1
        - 5

