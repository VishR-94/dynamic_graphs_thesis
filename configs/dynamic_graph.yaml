default_preset: structured_parallel_uniform
data:
  mode: real
  amount_mode: zero
forecasting:
  context_length: 60
  prediction_length: 60
  evaluation_horizons:
  - 1
  - 5
  - 15
  - 30
  - 60
  stride: 15
  input_channels:
  - open
  - high
  - low
  - close
  - volume
  target_channels:
  - open
  - high
  - low
  - close
  - volume
normalisation:
  method: kronos_context
  stats_from: context
  scope: per_asset_channel
  clip: true
  clip_min: -5.0
  clip_max: 5.0
  eps: 1.0e-05
models:
  dynamic_graph:
    num_nodes: 93
    context_length: 60
    d_model: 64
    num_st_blocks: 1
    use_node_embedding: true
    temporal:
      type: transformer
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0
      kernel_size: 3
      dilations:
      - 1
      - 2
      - 4
    graph:
      type: mtgnn_static
      num_heads: 2
      hidden_dim: 32
      activation: softmax
      add_self_loops: false
      mtgnn_embedding_dim: 16
      mtgnn_top_k: 8
      mtgnn_alpha: 3.0
      base_graph_type: mtgnn_static
      gate_type: learned_scalar
      initial_alpha: 0.5
    heads:
      prediction_length: 60
      evaluation_horizons:
      - 1
      - 5
      - 15
      - 30
      - 60
      s1_vocabulary_size: 1024
      s2_vocabulary_size: 1024
      s2_loss_weight: 1.0
      future_token_mode: full
      s2_conditioning: true_s1
    future_predictor:
      type: structured_parallel
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0
    loss:
      horizon_weighting: uniform
      exponential_half_life: 5.0
      exponential_floor_weight: 0.25
    graph_regularisation:
      graph_reg_layer: -1
      graph_reg_warmup_epochs: 0
      graph_entropy_reg: 0.0
      graph_target_entropy: null
      graph_target_entropy_reg: 0.0
      graph_temporal_smooth_reg: 0.0
    backcast:
      enabled: false
      loss_weight: 0.0
      num_channels: 5
training:
  learning_rate: 0.0001
  weight_decay: 0.0
  batch_size: 2
  num_workers: 0
  max_epochs: 50
  patience: 8
  seed: 42
  gradient_clip_norm: 1.0
  mixed_precision: true
    # Controls the checkpoint used for patience and best_checkpoint.pt.
  #
  # Supported values:
  #   decoded_cumulative_log_change_mae
  #   validation_token_loss
  early_stopping_metric: decoded_cumulative_log_change_mae

  # Used only when early_stopping_metric is
  # decoded_cumulative_log_change_mae.
  #
  # Keep the base configuration equivalent to the historical runs.
  # The new short-horizon run will override this to [1, 5].
  early_stopping_horizons:
    - 1
    - 5
    - 15
    - 30
    - 60
decoding:
  token_selection: argmax
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  sample_count: 1
presets:
  structured_parallel_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: uniform
  structured_parallel_weighted:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: exponential_decay
  autoregressive_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: autoregressive
        loss:
          horizon_weighting: uniform
  structured_parallel_coarse_only:
    models:
      dynamic_graph:
        heads:
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: uniform
  free_static_full_true_s1:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: full
          s2_loss_weight: 1.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform

  free_static_coarse_only:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: coarse_only
          s2_loss_weight: 0.0
          s2_conditioning: true_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform

  free_static_full_predicted_s1:
    models:
      dynamic_graph:
        graph:
          type: free_static
          base_graph_type: free_static

        graph_regularisation:
          graph_reg_layer: -1
          graph_reg_warmup_epochs: 0
          graph_entropy_reg: 0.0
          graph_target_entropy: 2.2
          graph_target_entropy_reg: 0.01
          graph_temporal_smooth_reg: 0.0

        heads:
          future_token_mode: full
          s2_loss_weight: 1.0
          s2_conditioning: predicted_s1

        future_predictor:
          type: structured_parallel

        loss:
          horizon_weighting: uniform

