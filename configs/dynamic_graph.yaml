default_preset: structured_parallel_uniform

data:
  mode: real
  amount_mode: zero

forecasting:
  context_length: 60
  prediction_length: 60
  evaluation_horizons:
    - 1
    - 5
    - 15
    - 30
    - 60
  stride: 15

  input_channels:
    - open
    - high
    - low
    - close
    - volume

  target_channels:
    - open
    - high
    - low
    - close
    - volume

normalisation:
  method: kronos_context
  stats_from: context
  scope: per_asset_channel
  clip: true
  clip_min: -5.0
  clip_max: 5.0
  eps: 1.0e-5

models:
  dynamic_graph:
    num_nodes: 93
    context_length: 60
    d_model: 64
    num_st_blocks: 1
    use_node_embedding: true

    temporal:
      type: transformer
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0
      kernel_size: 3
      dilations:
        - 1
        - 2
        - 4

    graph:
      # All three initial real-data predictor comparisons use the
      # same learned static graph. Only predictor type and loss
      # weighting differ between presets.
      type: mtgnn_static
      num_heads: 2
      hidden_dim: 32
      activation: softmax
      add_self_loops: false

      mtgnn_embedding_dim: 16
      mtgnn_top_k: 8
      mtgnn_alpha: 3.0

      base_graph_type: mtgnn_static
      gate_type: learned_scalar
      initial_alpha: 0.5

    heads:
      prediction_length: 60
      evaluation_horizons:
        - 1
        - 5
        - 15
        - 30
        - 60
      s1_vocabulary_size: 1024
      s2_vocabulary_size: 1024
      s2_loss_weight: 1.0
      condition_s2_on_s1: true

    future_predictor:
      type: structured_parallel
      num_layers: 1
      num_heads: 4
      feedforward_multiplier: 2
      dropout: 0.0

    loss:
      horizon_weighting: uniform
      gaussian_sigma: 2.0
      gaussian_peak_mass: 0.75

    backcast:
      enabled: false
      loss_weight: 0.0
      num_channels: 5

training:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  batch_size: 2
  num_workers: 0
  max_epochs: 50
  patience: 8
  seed: 42
  gradient_clip_norm: 1.0
  mixed_precision: true

decoding:
  token_selection: argmax
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  sample_count: 1

presets:
  structured_parallel_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: uniform

  structured_parallel_weighted:
    models:
      dynamic_graph:
        future_predictor:
          type: structured_parallel
        loss:
          horizon_weighting: gaussian_mixture

  autoregressive_uniform:
    models:
      dynamic_graph:
        future_predictor:
          type: autoregressive
        loss:
          horizon_weighting: uniform
